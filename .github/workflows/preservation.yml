name: Research preservation integrity
on: [push, pull_request]
jobs:
  formatted-paper-hashes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/build_preservation_release.py
      - run: python tools/audit_public_research.py
      - run: python -m unittest discover -s tools -p test_audit_public_research.py
